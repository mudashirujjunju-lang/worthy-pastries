services:
  - type: web
    name: worthy-pastries
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL # Internal Database URL of worthy-pastries-db (free Render Postgres)
        sync: false
      - key: NODE_VERSION
        value: "20"
