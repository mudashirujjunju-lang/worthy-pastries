<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin · Worthy Pastries</title><link rel="icon" href="/icon.svg">
<style>
:root{--brown:#7a3e1d;--cream:#fff6ea;--gold:#e8a33d}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f6f1ea;color:#3b1f12;font-size:14px}
header{background:var(--brown);color:#fff;padding:.7rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
header b{font-size:1.1rem}nav.tabs{display:flex;gap:.3rem;padding:.6rem 1.2rem;background:#fff;border-bottom:1px solid #e5d6c4;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:.5rem .9rem;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;color:#3b1f12}.tabs button.on{background:var(--brown);color:#fff}
main{padding:1rem 1.2rem;max-width:1400px;margin:auto}.warn{background:#fff1c2;border:1px solid #e8a33d;padding:.6rem 1rem;border-radius:8px;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}th,td{padding:.55rem .6rem;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#fbefe2;font-size:.8rem;text-transform:uppercase}
tr.sel{background:#fff8ee}.pill{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.78rem;font-weight:700;background:#eee}
.s-New{background:#ffe0e0}.s-Confirmed{background:#e0ecff}.s-Baking{background:#fff1c2}.s-Out{background:#e9dcff}.s-Delivered{background:#d8f5df}.s-Cancelled{background:#ddd;color:#777}
button.b,.b{background:var(--brown);color:#fff;border:0;border-radius:8px;padding:.45rem .8rem;font:inherit;cursor:pointer}.b.g{background:#fff;color:var(--brown);border:1px solid var(--brown)}.b.r{background:#b00020}
input,select,textarea{font:inherit;padding:.4rem;border:1px solid #d9b48f;border-radius:6px}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}.filters button{border:1px solid #d9b48f;background:#fff;border-radius:99px;padding:.3rem .8rem;cursor:pointer;font:inherit}.filters button.on{background:var(--brown);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:1rem}.stat{background:#fff;padding:.8rem;border-radius:10px}.stat b{display:block;font-size:1.4rem}
.split{display:grid;grid-template-columns:1fr 380px;gap:1rem}.card{background:#fff;border-radius:10px;padding:1rem}
.card h3{margin-top:0}.kv div{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0;border-bottom:1px dashed #eee}
.login{max-width:340px;margin:12vh auto;background:#fff;padding:2rem;border-radius:14px;display:grid;gap:.8rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem}.row{display:flex;gap:.4rem;align-items:center;margin:.3rem 0;flex-wrap:wrap}
.err{color:#b00020;font-weight:600}.muted{color:#888}.toast{position:fixed;bottom:1rem;right:1rem;background:#1b7a3a;color:#fff;padding:.6rem 1rem;border-radius:8px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>'UGX '+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('wp-admin'),tab='orders',filter='',sel=null,ORD=[],warnDefault=false;
const api=async(url,method='GET',body)=>{const r=await fetch(url,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401){token=null;sessionStorage.removeItem('wp-admin');login();throw new Error('Session expired')}if(!r.ok)throw new Error(j.error||'Error');return j};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1800)};
const fail=e=>alert(e.message);
function login(){$('#app').innerHTML=`<form class="login" id="lf"><h2 style="margin:0">🎂 Worthy Pastries Admin</h2><input type="password" name="p" placeholder="Admin password" required autofocus><p class="err" id="le"></p><button class="b">Log in</button></form>`;
$('#lf').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.p.value})});const j=await r.json();if(!r.ok)return $('#le').textContent=j.error;token=j.token;sessionStorage.setItem('wp-admin',token);shell()}}
function shell(){$('#app').innerHTML=`<header><b>🎂 Worthy Pastries · Admin</b><span><a href="/" target="_blank" style="color:#fff">View site</a> &nbsp; <button class="b g" id="lo">Log out</button></span></header>
<nav class="tabs">${[['orders','📦 Orders'],['custom','🎨 Custom requests'],['menu','🍰 Menu'],['promos','🏷️ Promo codes'],['reviews','⭐ Reviews'],['settings','⚙️ Settings']].map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</nav><main id="main"></main>`;
$('#lo').onclick=()=>{sessionStorage.removeItem('wp-admin');token=null;login()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;shell()});({orders,custom,menu,promos,reviews,settings})[tab]().catch(fail)}
const warnBox=()=>warnDefault?'<div class="warn">⚠️ You are using the default admin password <b>changeme</b>. Set the <code>ADMIN_PASSWORD</code> environment variable before going live.</div>':'';
async function orders(){const d=await api('/api/admin/orders'+(filter?'?status='+encodeURIComponent(filter):''));ORD=d.orders;warnDefault=d.defaultPassword;
const total=Object.values(d.counts).reduce((a,b)=>a+b,0),open=total-(d.counts.Delivered||0)-(d.counts.Cancelled||0),unpaid=ORD.filter(o=>!o.paid&&o.status!=='Cancelled').reduce((a,o)=>a+o.total,0);
$('#main').innerHTML=warnBox()+`<div class="stats"><div class="stat">All orders<b>${total}</b></div><div class="stat">Open orders<b>${open}</b></div><div class="stat">New (needs confirming)<b>${d.counts.New||0}</b></div><div class="stat">Unpaid (shown)<b>${fmt(unpaid)}</b></div></div>
<div class="filters">${['',...d.statuses].map(s=>`<button data-f="${s}" class="${s===filter?'on':''}">${s||'All'} ${s?`(${d.counts[s]||0})`:''}</button>`).join('')}</div>
<div class="split"><div><table><tr><th>Order #</th><th>Placed</th><th>Customer</th><th>Delivery</th><th>Total</th><th>Payment</th><th>Status</th></tr>
${ORD.map(o=>`<tr data-o="${esc(o.number)}" class="${sel===o.number?'sel':''}" style="cursor:pointer"><td><b>${esc(o.number)}</b></td><td>${new Date(o.created_at).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(o.name)}<br><span class="muted">${esc(o.phone)}</span></td><td>${esc(o.date)}<br><span class="muted">${esc(o.area)}</span></td><td>${fmt(o.total)}</td><td>${esc(o.payment)}<br>${o.paid?'<span class="pill s-Delivered">PAID</span>':'<span class="pill">unpaid</span>'}</td><td><span class="pill s-${esc(o.status.split(' ')[0])}">${esc(o.status)}</span></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No orders yet.</td></tr>'}</table></div>
<div id="detail" class="card">${sel?'':'<p class="muted">Click an order to view details and update it.</p>'}</div></div>`;
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;orders().catch(fail)});document.querySelectorAll('[data-o]').forEach(r=>r.onclick=()=>{sel=r.dataset.o;orders().catch(fail)});
const o=ORD.find(x=>x.number===sel);if(o)detail(o,d.statuses)}
function detail(o,st){const wa='256'+o.phone_norm.slice(3);$('#detail').innerHTML=`<h3>${esc(o.number)}</h3><div class="kv">
<div><span>Customer</span><b>${esc(o.name)}</b></div><div><span>Phone</span><a href="tel:+${esc(o.phone_norm)}">${esc(o.phone)}</a></div><div><span>Area</span><span>${esc(o.area)}</span></div><div><span>Delivery date</span><b>${esc(o.date)}</b></div>
<div><span>Cake message</span><span>${esc(o.message)||'-'}</span></div><div><span>Notes</span><span>${esc(o.notes)||'-'}</span></div></div><h4>Items</h4><div class="kv">
${o.items.map(i=>`<div><span>${i.qty} × ${esc(i.name)} (${esc(i.size)})</span><span>${fmt(i.line)}</span></div>`).join('')}<div><span>Subtotal</span><span>${fmt(o.subtotal)}</span></div>${o.discount?`<div><span>Discount ${esc(o.promo)}</span><span>− ${fmt(o.discount)}</span></div>`:''}<div><span>Delivery</span><span>${fmt(o.delivery_fee)}</span></div><div><b>Total</b><b>${fmt(o.total)}</b></div><div><span>Payment</span><span>${esc(o.payment)}</span></div></div>
<h4>Update</h4><div class="row"><select id="st">${st.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button class="b" id="saveSt">Save status</button></div>
<div class="row"><label><input type="checkbox" id="paid" ${o.paid?'checked':''}> Paid</label></div>
<div class="row"><a class="b g" target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(`Hello ${o.name}, this is Norah from Worthy Pastries about your order ${o.number}. Status: ${o.status}.`)}">💬 WhatsApp customer</a></div>
<p class="muted">Updated ${new Date(o.updated_at).toLocaleString()}</p>`;
$('#saveSt').onclick=()=>api('/api/admin/orders/'+encodeURIComponent(o.number),'PATCH',{status:$('#st').value}).then(()=>{toast('Status updated');orders()}).catch(fail);
$('#paid').onchange=e=>api('/api/admin/orders/'+encodeURIComponent(o.number),'PATCH',{paid:e.target.checked}).then(()=>{toast(e.target.checked?'Marked paid':'Marked unpaid');orders()}).catch(fail)}
async function custom(){const rs=await api('/api/admin/custom-requests');$('#main').innerHTML=`<table><tr><th>Ref</th><th>Received</th><th>Customer</th><th>Occasion / date</th><th>Budget</th><th>Description</th><th>Photo</th><th>Status</th></tr>${rs.map(r=>`<tr><td>CR-${r.id}</td><td>${new Date(r.created_at).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(r.name)}<br><a href="https://wa.me/256${esc(r.phone.replace(/\D/g,'').replace(/^(256|0)/,''))}" target="_blank">${esc(r.phone)}</a></td><td>${esc(r.occasion)}<br>${esc(r.date)}</td><td>${r.budget?fmt(r.budget):'-'}</td><td style="max-width:320px">${esc(r.description)}</td><td>${r.photo?`<a href="/admin/uploads/${esc(r.photo)}?t=${encodeURIComponent(token)}" target="_blank"><img src="/admin/uploads/${esc(r.photo)}?t=${encodeURIComponent(token)}" style="width:70px;border-radius:6px"></a>`:'-'}</td><td><select data-cr="${r.id}">${['New','Quoted','Accepted','Declined','Done'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No custom requests yet.</td></tr>'}</table>`;
document.querySelectorAll('[data-cr]').forEach(s=>s.onchange=()=>api('/api/admin/custom-requests/'+s.dataset.cr,'PATCH',{status:s.value}).then(()=>toast('Saved')).catch(fail))}
async function menu(){const cs=await api('/api/admin/cakes');const form=c=>`<form class="card" data-cake="${esc(c.id||'')}"><div class="row"><input name="emoji" value="${esc(c.emoji||'🎂')}" style="width:3.2rem"><input name="name" value="${esc(c.name||'')}" placeholder="Name" style="flex:1" required>${c.id?`<span class="muted">${esc(c.id)}</span>`:'<input name="id" placeholder="id e.g. lemon-cake" required>'}</div>
<div class="row"><input name="cat" value="${esc(c.cat||'')}" placeholder="Category" list="cats"><input name="bg" type="color" value="${esc(c.bg||'#fff1c9')}"><label>Sort <input name="sort" type="number" value="${c.sort??99}" style="width:4rem"></label><label><input type="checkbox" name="available" ${c.available!==false?'checked':''}> Available</label></div>
<textarea name="desc" rows="2" style="width:100%">${esc(c.desc||'')}</textarea><div class="sizes">${(c.sizes||[{label:'1 kg',price:''}]).map(s=>`<div class="row sz"><input name="label" value="${esc(s.label)}" placeholder="Size"><input name="price" type="number" min="1" value="${s.price}" placeholder="Price UGX"><button type="button" class="b g" data-rm>✕</button></div>`).join('')}</div>
<div class="row"><button type="button" class="b g" data-addsz>+ size</button><button class="b">Save</button>${c.id?'<button type="button" class="b r" data-del>Delete</button>':''}</div></form>`;
$('#main').innerHTML=`<datalist id="cats">${[...new Set(cs.map(c=>c.cat))].map(c=>`<option>${esc(c)}</option>`).join('')}</datalist><h3>Add a new cake</h3>${form({})}<h3>Menu (${cs.length} cakes)</h3><div class="grid2">${cs.map(form).join('')}</div>`;
document.querySelectorAll('[data-cake]').forEach(fm=>{fm.addEventListener('click',e=>{if(e.target.dataset.rm!==undefined)e.target.closest('.sz').remove();if(e.target.dataset.addsz!==undefined)fm.querySelector('.sizes').insertAdjacentHTML('beforeend','<div class="row sz"><input name="label" placeholder="Size"><input name="price" type="number" min="1" placeholder="Price UGX"><button type="button" class="b g" data-rm>✕</button></div>');if(e.target.dataset.del!==undefined&&confirm('Delete this cake?'))api('/api/admin/cakes/'+fm.dataset.cake,'DELETE').then(menu).catch(fail)});
fm.onsubmit=e=>{e.preventDefault();const id=fm.dataset.cake||fm.id.value.trim();api('/api/admin/cakes/'+encodeURIComponent(id),'PUT',{name:fm.name.value,emoji:fm.emoji.value,cat:fm.cat.value,bg:fm.bg.value,sort:+fm.sort.value,available:fm.available.checked,desc:fm.desc.value,sizes:[...fm.querySelectorAll('.sz')].map(r=>({label:r.querySelector('[name=label]').value,price:r.querySelector('[name=price]').value}))}).then(()=>{toast('Saved');if(!fm.dataset.cake)menu()}).catch(fail)}})}
async function promos(){const ps=await api('/api/admin/promos');$('#main').innerHTML=`<div class="card"><h3>Promo codes</h3><p class="muted">Discounts are calculated on the server on the cake subtotal (not delivery). "First order only" checks the customer's phone number against previous orders.</p>
<table><tr><th>Code</th><th>% off</th><th>First order only</th><th>Active</th><th></th></tr>${ps.map(p=>`<tr><td><b>${esc(p.code)}</b></td><td><input type="number" value="${p.percent}" min="1" max="90" data-pct style="width:5rem"></td><td><input type="checkbox" data-first ${p.first_order_only?'checked':''}></td><td><input type="checkbox" data-act ${p.active?'checked':''}></td><td><button class="b" data-save="${esc(p.code)}">Save</button> <button class="b r" data-delp="${esc(p.code)}">Delete</button></td></tr>`).join('')}
<tr><td><input id="nc" placeholder="NEWCODE"></td><td><input id="np" type="number" value="10" style="width:5rem"></td><td><input type="checkbox" id="nf"></td><td>✓</td><td><button class="b" id="addp">Add</button></td></tr></table></div>`;
document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const tr=b.closest('tr');api('/api/admin/promos/'+b.dataset.save,'PUT',{percent:tr.querySelector('[data-pct]').value,first_order_only:tr.querySelector('[data-first]').checked,active:tr.querySelector('[data-act]').checked}).then(()=>toast('Saved')).catch(fail)});
document.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>confirm('Delete code?')&&api('/api/admin/promos/'+b.dataset.delp,'DELETE').then(promos).catch(fail));
$('#addp').onclick=()=>api('/api/admin/promos/'+encodeURIComponent($('#nc').value.trim()),'PUT',{percent:$('#np').value,first_order_only:$('#nf').checked,active:true}).then(promos).catch(fail)}
async function reviews(){const rs=await api('/api/admin/reviews');const fm=r=>`<form class="card" data-rev="${r.id||''}"><div class="row"><input name="name" value="${esc(r.name||'')}" placeholder="Customer name" required><select name="rating">${[5,4,3,2,1].map(n=>`<option ${n===(r.rating||5)?'selected':''}>${n}</option>`).join('')}</select>★</div><textarea name="text" rows="3" style="width:100%" required placeholder="Review text">${esc(r.text||'')}</textarea>
<div class="row"><label><input type="checkbox" name="visible" ${r.visible!==0?'checked':''}> Visible</label><label><input type="checkbox" name="sample" ${r.sample?'checked':''}> Sample (labelled "Sample review")</label><button class="b">Save</button>${r.id?'<button type="button" class="b r" data-delr>Delete</button>':''}</div></form>`;
$('#main').innerHTML=`<p class="warn">The seeded reviews are <b>samples</b>. Replace them with real customer reviews (untick "Sample") or delete them.</p><h3>Add review</h3>${fm({})}<h3>Reviews</h3><div class="grid2">${rs.map(fm).join('')}</div>`;
document.querySelectorAll('[data-rev]').forEach(f=>{f.onsubmit=e=>{e.preventDefault();api('/api/admin/reviews','POST',{id:f.dataset.rev||undefined,name:f.name.value,text:f.text.value,rating:f.rating.value,visible:f.visible.checked,sample:f.sample.checked}).then(()=>{toast('Saved');reviews()}).catch(fail)};const d=f.querySelector('[data-delr]');if(d)d.onclick=()=>confirm('Delete review?')&&api('/api/admin/reviews/'+f.dataset.rev,'DELETE').then(reviews).catch(fail)})}
async function settings(){const [s,cs]=await Promise.all([api('/api/admin/settings'),api('/api/admin/cakes')]);const w=s.cakeOfWeek||{};
$('#main').innerHTML=`<div class="grid2"><form class="card" id="cotw"><h3>⭐ Cake of the week banner</h3><label><input type="checkbox" name="enabled" ${w.enabled?'checked':''}> Show banner</label><div class="row"><input name="badge" value="${esc(w.badge)}" placeholder="Badge" style="flex:1"></div><div class="row"><input name="title" value="${esc(w.title)}" placeholder="Title" style="flex:1"></div><textarea name="text" rows="3" style="width:100%">${esc(w.text)}</textarea><div class="row">Featured cake <select name="cakeId"><option value="">(none)</option>${cs.map(c=>`<option value="${esc(c.id)}" ${c.id===w.cakeId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><button class="b">Save banner</button></form>
<form class="card" id="pay"><h3>📱 Mobile Money payment instructions</h3><p class="muted">Shown to customers choosing MTN MoMo or Airtel Money (checkout and confirmation). Add your merchant code or MoMo number here when you have one.</p><textarea name="instructions" rows="4" style="width:100%">${esc(s.payment.instructions)}</textarea><button class="b">Save</button></form>
<form class="card" id="fees"><h3>🛵 Delivery fees by area (UGX)</h3><div id="feeRows">${s.deliveryFees.map(f=>`<div class="row fr"><input name="area" value="${esc(f.area)}" style="flex:1"><input name="fee" type="number" min="0" step="500" value="${f.fee}" style="width:7rem"><button type="button" class="b g" data-rm>✕</button></div>`).join('')}</div><div class="row"><button type="button" class="b g" id="addFee">+ area</button><button class="b">Save fees</button></div><p class="muted">Set fee to 0 for free delivery (Makindye is free by default).</p></form>
<form class="card" id="soc"><h3>🔗 Social links (optional)</h3><p class="muted">Leave blank to hide. Links appear in the site footer only when filled in. Must start with https://</p>${['instagram','tiktok','facebook'].map(k=>`<div class="row"><label style="width:6rem">${k}</label><input name="${k}" value="${esc(s.social[k])}" placeholder="https://..." style="flex:1"></div>`).join('')}<button class="b">Save links</button></form></div>`;
const save=(b,m)=>api('/api/admin/settings','PUT',b).then(()=>toast(m||'Saved')).catch(fail);
$('#cotw').onsubmit=e=>{e.preventDefault();const f=e.target;save({cakeOfWeek:{enabled:f.enabled.checked,badge:f.badge.value,title:f.title.value,text:f.text.value,cakeId:f.cakeId.value}})};
$('#pay').onsubmit=e=>{e.preventDefault();save({payment:{instructions:e.target.instructions.value}})};
$('#soc').onsubmit=e=>{e.preventDefault();const f=e.target;save({social:{instagram:f.instagram.value,tiktok:f.tiktok.value,facebook:f.facebook.value}})};
$('#fees').onclick=e=>{if(e.target.dataset.rm!==undefined)e.target.closest('.fr').remove()};$('#addFee').onclick=()=>$('#feeRows').insertAdjacentHTML('beforeend','<div class="row fr"><input name="area" style="flex:1" placeholder="Area"><input name="fee" type="number" min="0" step="500" value="0" style="width:7rem"><button type="button" class="b g" data-rm>✕</button></div>');
$('#fees').onsubmit=e=>{e.preventDefault();save({deliveryFees:[...document.querySelectorAll('.fr')].map(r=>({area:r.querySelector('[name=area]').value,fee:r.querySelector('[name=fee]').value}))})}}
token?shell():login();
</script></body></html>
